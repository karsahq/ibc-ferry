# Chain definitions are static configuration. Runtime state lives in the
# state database, not here.
#
# Fees are derived from gas_prices and each transaction's gas limit. Add a
# [[chains.<name>.fee]] table only when you want to pay a higher fixed floor.

[chains.karsa]
binary = "/tmp/karsad"
home = "/tmp/karsa-ibc-a"
node = "tcp://127.0.0.1:26657"
rpc = "http://127.0.0.1:26657"
chain_id = "karsa_262144-1"
keyring_backend = "test"
from = "relayer"
gas_prices = "22000000000akra"

[chains.gaia]
binary = "/home/derika/.local/bin/gaiad"
home = "/tmp/gaia-ibc"
node = "tcp://127.0.0.1:26658"
rpc = "http://127.0.0.1:26658"
chain_id = "gaia-test-1"
keyring_backend = "test"
from = "relayer"
gas_prices = "1stake"

