services:
  ferry:
    image: ghcr.io/karsahq/ibc-ferry:${FERRY_IMAGE_TAG:-latest}
    # For local development, replace the image with: build: .
    command:
      - --config
      - /etc/ibc-ferry/config.toml
      - --state
      - /var/lib/ibc-ferry/state.db
      - start
      - --http-addr
      - 0.0.0.0:8080
    volumes:
      - ${FERRY_CONFIG:-./config.container.docker.toml}:/etc/ibc-ferry/config.toml:ro
      - ferry-state:/var/lib/ibc-ferry
      - ${FERRY_BIN_DIR:-./bin}:/opt/ferry/bin:ro
      - ${FERRY_CHAINS_DIR:-./chains}:/var/lib/ferry/chains
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

volumes:
  ferry-state:
