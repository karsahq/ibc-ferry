[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ibc-ferry"
version = "0.1.0"
description = "A minimal IBC v2 packet ferry for native Cosmos chains"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
ibc-ferry = "ibc_ferry:main"

[tool.setuptools]
py-modules = ["ibc_ferry"]
